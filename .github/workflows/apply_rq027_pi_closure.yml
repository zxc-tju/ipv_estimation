name: Apply RQ027 PI closure

on:
  push:
    branches:
      - rq027-close-published-estimator-scope

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[rq027-closure-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final RQ027 decision and close the study
        run: python scripts/apply_rq027_pi_closure.py

      - name: Validate closure state
        run: |
          git diff --check
          test -s reports/knowledge/RQ027_known_truth_ipv_recovery/decision.md
          grep -q 'CLOSED_BY_PI_SCOPE_DECISION' reports/knowledge/RQ027_known_truth_ipv_recovery/decision.md
          grep -q 'CLOSED / PI_SCOPE_DECISION' STUDIES.md
          grep -q 'RQ027 PI closure' main_workflow.log

      - name: Commit closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            START_HERE.md \
            STUDIES.md \
            main_workflow.log \
            reports/knowledge/RQ027_known_truth_ipv_recovery/README.md \
            reports/knowledge/RQ027_known_truth_ipv_recovery/synthesis.md \
            reports/knowledge/RQ027_known_truth_ipv_recovery/decision.md \
            .github/workflows/apply_rq027_pi_closure.yml \
            scripts/apply_rq027_pi_closure.py
          git commit -m "Close RQ027 by PI scope decision [rq027-closure-applied]"
          git push
