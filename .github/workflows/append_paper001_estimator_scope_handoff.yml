name: Append PAPER001 estimator-scope handoff

on:
  push:
    branches:
      - paper001-estimator-scope-handoff

permissions:
  contents: write

jobs:
  append:
    if: ${{ !contains(github.event.head_commit.message, '[paper001-handoff-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append and validate the handoff
        run: |
          python scripts/append_paper001_estimator_scope_handoff.py
          git diff --check
          grep -q 'ff9a4f97d4427741628b65bb62833e9db3394419' reports/knowledge/PAPER001_online_sociality_verification_manuscript/imported_from_paper_repo_20260620/agent_handoff.md

      - name: Remove one-shot files and commit
        run: |
          rm .github/workflows/append_paper001_estimator_scope_handoff.yml
          rm scripts/append_paper001_estimator_scope_handoff.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/knowledge/PAPER001_online_sociality_verification_manuscript/imported_from_paper_repo_20260620/agent_handoff.md main_workflow.log .github/workflows/append_paper001_estimator_scope_handoff.yml scripts/append_paper001_estimator_scope_handoff.py
          git commit -m "Record PAPER001 estimator-scope merge [paper001-handoff-applied]"
          git push
