name: Install subjective experiment web package

on:
  push:
    branches:
      - feature/subjective-experiment-web-system

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[subjective-web-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and install the application
        run: |
          set -euo pipefail
          cat .codex-transfer/subjective-node/part_* > /tmp/subjective-node.b64
          base64 -d /tmp/subjective-node.b64 > /tmp/subjective-node.zip
          echo 'e64182066e8df6c5cb8a37a48455857cf6e07992e4056ae0c55d534a23a6d900  /tmp/subjective-node.zip' | sha256sum -c -

          rm -rf /tmp/subjective-node-unpacked
          mkdir -p /tmp/subjective-node-unpacked
          unzip -oq /tmp/subjective-node.zip -d /tmp/subjective-node-unpacked

          test ! -e apps/subjective_experiment_web
          mkdir -p apps/subjective_experiment_web .github/workflows
          cp -a /tmp/subjective-node-unpacked/. apps/subjective_experiment_web/
          rm -rf apps/subjective_experiment_web/.github
          cp /tmp/subjective-node-unpacked/.github/workflows/subjective-experiment-web.yml .github/workflows/subjective-experiment-web.yml

          test -f apps/subjective_experiment_web/server.js
          test -f apps/subjective_experiment_web/config/study.demo.json
          test -f .github/workflows/subjective-experiment-web.yml

      - name: Run syntax, configuration and end-to-end checks
        working-directory: apps/subjective_experiment_web
        run: |
          npm run check
          npm run validate
          npm test

      - name: Smoke-test the HTTP service
        working-directory: apps/subjective_experiment_web
        env:
          NODE_ENV: development
          EXPERIMENT_SECRET_KEY: ci-secret-key-with-at-least-thirty-two-bytes
          EXPERIMENT_ADMIN_TOKEN: ci-admin-token
          EXPERIMENT_DATABASE: /tmp/subjective-experiment-ci.sqlite3
          HOST: 127.0.0.1
          PORT: 39123
        run: |
          set -euo pipefail
          node server.js >/tmp/subjective-experiment-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:39123/health >/tmp/health.json; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" = 1
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:39123/ >/tmp/landing.html
          grep -q '驾驶互动行为评价实验' /tmp/landing.html

      - name: Register the project entry
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '<!-- SUBJECTIVE_EXPERIMENT_WEB_SYSTEM -->'
          block = '''<!-- SUBJECTIVE_EXPERIMENT_WEB_SYSTEM -->
          ## Subjective experiment web system

          - Path: `apps/subjective_experiment_web`
          - Role: source-blind prospective evaluation of conditional social atypicality using pairwise preference and single-clip ratings.
          - Participant flow: consent and screening → instructions and practice → pairwise block → break → single-clip block → post-study survey.
          - Researcher functions: SQLite storage, event logging, signed sessions, protected exports, frozen study/stimulus configuration and analysis-ready CSV/JSON exports.
          - Local checks: `npm run check`, `npm run validate`, `npm test`.
          - Before recruitment: replace demo clips, insert ethics-approved text, freeze the production manifests, configure unique secrets and HTTPS, and complete a device/network pilot.
          '''

          start = Path('START_HERE.md')
          text = start.read_text(encoding='utf-8')
          if marker not in text:
              start.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          log = Path('main_workflow.log')
          with log.open('a', encoding='utf-8') as handle:
              handle.write('\n2026-08-29 | Added apps/subjective_experiment_web: source-blind pairwise and single-clip subjective experiment system; checks and end-to-end flow passed.\n')
          PY

      - name: Remove transfer scaffolding and commit the installed system
        run: |
          set -euo pipefail
          rm -rf .codex-transfer/subjective-node
          rm -f .github/workflows/install-subjective-experiment-web.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/subjective_experiment_web \
                  .github/workflows/subjective-experiment-web.yml \
                  .github/workflows/install-subjective-experiment-web.yml \
                  .codex-transfer/subjective-node \
                  START_HERE.md main_workflow.log
          git commit -m 'Add subjective experiment web system [subjective-web-installed]'
          git push
